name: Core and packaging checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the independent animation core
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/core_test.cpp -o /tmp/hyprflip-core-test
          /tmp/hyprflip-core-test
      - name: Test card helpers and installer recovery
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Check Python syntax and plugin manifest
        run: |
          python3 -m compileall -q scripts tests
          python3 -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path("hyprpm.toml").read_text())'

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Pull only: no token, nothing is pushed from pushes or pull requests.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nixarchy
          extraPullNames: hyprland
          skipPush: true
      - name: Build both plugins, run CTest and evaluate the modules
        run: nix flake check -L
